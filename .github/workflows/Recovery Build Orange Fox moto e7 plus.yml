name: OrangeFox 12.1 Recovery - Moto E7 Plus (guam)

on:
  workflow_dispatch:

jobs:
  build:
    # Docker/Runner de GitHub completamente actualizado y soportado oficialmente
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout del Repositorio
      uses: actions/checkout@v4

    - name: Liberar Espacio de Almacenamiento Masivo
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /share/swift
        sudo apt-get remove --purge --auto-remove google-chrome-stable microsoft-edge-stable firefox -y
        sudo apt-get clean
        df -h

    - name: Instalar Dependencias Modernas (Sin Paquetes Obsoletos ni Bucles)
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential git git-lfs bc bison flex g++-multilib gcc-multilib \
          libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools \
          xsltproc zip zlib1g-dev lib32z1-dev libtinfo5 libncurses5 libncurses5-dev \
          lib32ncurses-dev python3 python3-pip python-is-python3 libssl-dev \
          curl wget liblz4-tool openjdk-11-jdk libgmp-dev libmpfr-dev libmpc-dev \
          gperf libcap-dev python3-setuptools

    - name: Configurar e Instalar Herramienta Repo de Google
      run: |
        mkdir -p ~/bin
        curl https://googleapis.com > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Configurar Identidad de Git
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"

    - name: Descargar Sincronizador Oficial de OrangeFox
      run: |
        mkdir -p ~/OrangeFox_sync
        cd ~/OrangeFox_sync
        git clone https://gitlab.com/OrangeFox/sync.git

    - name: Sincronizar Manifiesto de OrangeFox 12.1 (Ahorro de espacio)
      run: |
        cd ~/OrangeFox_sync/sync
        # Ejecuta la sincronización apuntando a la arquitectura de ramas moderna 12.1
        ./orangefox_sync.sh --branch 12.1 --path ${{ github.workspace }}/fox_12.1

    - name: Clonar Árbol de Dispositivo (guam)
      run: |
        cd ${{ github.workspace }}/fox_12.1
        # Se inyecta el Device Tree específico adaptado a las variables criptográficas de OrangeFox
        git clone https://github.com -b lineage-21 device/motorola/guam

    - name: Configurar Variables Criptográficas y Compilar OrangeFox
      run: |
        cd ${{ github.workspace }}/fox_12.1
        export ALLOW_MISSING_DEPENDENCIES=true
        export LC_ALL=C
        
        # --- PARÁMETROS CRÍTICOS PARA DESENCRIPTACIÓN COMPLETA DE ALMACENAMIENTO ---
        export TW_INCLUDE_CRYPTO=true
        export TW_INCLUDE_CRYPTO_FBE=true
        export TW_INCLUDE_FBE_METADATA_DECRYPT=true
        export PLATFORM_VERSION="14"
        export PLATFORM_SECURITY_PATCH="2026-03-01"
        export TARGET_HW_DISK_ENCRYPTION=true
        # ---------------------------------------------------------------------------

        source build/envsetup.sh
        # Al usar OrangeFox el prefijo cambia dinámicamente a omni_ o fox_
        lunch omni_guam-eng || lunch twrp_guam-eng
        
        # Forzar la compilación del binario limpio
        mka recoveryimage -j$(nproc --all)

    - name: Subir OrangeFox Compilado (Instalable por Fastboot y Recovery)
      uses: actions/upload-artifact@v4
      with:
        name: OrangeFox-Android14-Desencriptado-guam
        path: |
          ${{ github.workspace }}/fox_12.1/out/target/product/guam/OrangeFox*.img
          ${{ github.workspace }}/fox_12.1/out/target/product/guam/OrangeFox*.zip
          ${{ github.workspace }}/fox_12.1/out/target/product/guam/recovery.img
          
